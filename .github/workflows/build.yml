name: "PitchKernel — Build (ReSukiSU + SuSFS + BBR)"

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Target device codename"
        type: string
        default: "munch"
      use_ksu:
        description: "Enable ReSukiSU + SuSFS"
        type: boolean
        default: true
      clang_version:
        description: "ZyC-Clang release tag (check https://github.com/ZyCromerZ/Clang/releases for the latest)"
        type: string
        default: "16.0.6-20260510-release"
      clang_filename:
        description: "Asset filename matching clang_version (must match exactly)"
        type: string
        default: "Clang-16.0.6-20260510.tar.gz"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: "Checkout kernel source"
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: "Free disk space"
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: "Install build dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl wget bison flex zip bc cpio \
            libssl-dev ccache tar python-is-python3

      - name: "Restore ccache"
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache_mikernel
          key: ccache-${{ inputs.device }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.device }}-${{ github.ref_name }}-

      - name: "Download ZyC-Clang toolchain"
        run: |
          mkdir -p "$HOME/zyc-clang"
          cd "$HOME/zyc-clang"
          curl -LSs --retry 3 -o clang.tar.gz \
            "https://github.com/ZyCromerZ/Clang/releases/download/${{ inputs.clang_version }}/${{ inputs.clang_filename }}"
          tar -xzf clang.tar.gz
          rm clang.tar.gz
          echo "$HOME/zyc-clang/bin" >> "$GITHUB_PATH"

      - name: "Verify toolchain"
        run: |
          export PATH="$HOME/zyc-clang/bin:$PATH"
          clang --version
          aarch64-linux-gnu-ld --version | head -1
          arm-linux-gnueabi-ld --version | head -1

      - name: "Build kernel (${{ inputs.device }})"
        run: |
          chmod +x build.sh
          if [ "${{ inputs.use_ksu }}" = "true" ]; then
            bash build.sh "${{ inputs.device }}" ksu
          else
            bash build.sh "${{ inputs.device }}"
          fi

      - name: "Locate output zips"
        id: find_zips
        run: |
          echo "Zips produced:"
          ls -la ./*.zip
          {
            echo "zip_glob<<EOF"
            ls ./*.zip
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: "Upload AOSP + MIUI zips"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: PitchKernel-${{ inputs.device }}-${{ github.run_number }}
          path: ./*.zip
          retention-days: 14
          if-no-files-found: error

      - name: "Ccache stats"
        if: always()
        run: ccache --show-stats || true
        
